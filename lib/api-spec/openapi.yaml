openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Invoice Capture MVP API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: invoices
    description: Invoice capture operations
  - name: vendors
    description: Vendor ID master operations
  - name: audit
    description: Audit log operations
  - name: storage
    description: Object storage upload and serving endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Invoices ────────────────────────────────────────────────────────────────
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List all invoices
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_EXTRACTION, EXCEPTION, PENDING_APPROVAL, APPROVED, POSTED, VOIDED]
        - name: includeRemoved
          in: query
          description: When true, voided/removed invoices are included in results. Removed invoices are excluded by default.
          schema:
            type: boolean
            default: false
        - name: vendorId
          in: query
          schema:
            type: ["integer", "null"]
        - name: search
          in: query
          schema:
            type: string
          description: Free-text search across invoice number, vendor name, vendor code, PO number, voucher ID, source file name, and business document ID
        - name: tieOutStatus
          in: query
          schema:
            type: string
            enum: [PASS, WARNING, FAIL, SKIPPED]
        - name: validationStatus
          in: query
          schema:
            type: string
        - name: exportStatus
          in: query
          schema:
            type: string
            enum: [NOT_READY, READY, EXPORTED, FAILED, BLOCKED]
        - name: sourceDocumentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: poNumber
          in: query
          schema:
            type: string
        - name: voucherId
          in: query
          schema:
            type: string
        - name: businessDocumentId
          in: query
          schema:
            type: string
        - name: exportBatchId
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          description: Filter by invoiceDate on/after this date (YYYY-MM-DD)
          schema:
            type: string
        - name: dateTo
          in: query
          description: Filter by invoiceDate on/before this date (YYYY-MM-DD)
          schema:
            type: string
        - name: amountMin
          in: query
          schema:
            type: ["number", "null"]
        - name: amountMax
          in: query
          schema:
            type: ["number", "null"]
        - name: confidenceMin
          in: query
          description: Minimum overall confidence as a percentage (0-100)
          schema:
            type: ["number", "null"]
        - name: confidenceMax
          in: query
          description: Maximum overall confidence as a percentage (0-100)
          schema:
            type: ["number", "null"]
        - name: assignedTo
          in: query
          description: Filter PENDING_APPROVAL invoices by the Clerk user ID of who submitted them
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, invoiceDate, dueDate, totalAmount, vendorName, confidenceScore, status]
            default: createdAt
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceListResponse"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create a new invoice record after file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "409":
          description: Duplicate invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /invoices/stats:
    get:
      operationId: getInvoiceStats
      tags: [invoices]
      summary: Invoice pipeline summary stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceStats"

  /invoices/export:
    get:
      operationId: exportInvoicesCsv
      tags: [invoices]
      summary: Export approved invoices as CSV
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [APPROVED, POSTED]
            default: APPROVED
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update invoice fields (creates audit log entries)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Duplicate invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Permanently hard-delete an invoice (test-data cleanup)
      description: >-
        Permanently removes an invoice and its audit/extraction records. Posted
        invoices cannot be hard-deleted (void/remove them instead). The stored
        source file is deleted only when no other invoice references it. Requires
        explicit confirmation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HardDeleteInput"
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Invoice cannot be hard-deleted (e.g. posted) or confirmation missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /invoices/{id}/void:
    post:
      operationId: voidInvoice
      tags: [invoices]
      summary: Void/remove an invoice (soft removal with reason)
      description: >-
        Marks an invoice as VOIDED with a required reason. Voided invoices are
        excluded from active lists, queues, KPIs, CSV export and duplicate
        detection by default.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemovalInput"
      responses:
        "200":
          description: Voided invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Missing removal reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /invoices/{id}/match-vendor:
    post:
      operationId: matchInvoiceVendor
      tags: [invoices]
      summary: Run vendor matching on vendorRawName
      description: Normalizes vendorRawName and matches against vendor_id table. Updates vendorId and routes to Exception if no match, low confidence, inactive, or on-hold.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice after matching
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: No vendorRawName on invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /invoices/{id}/extract:
    post:
      operationId: extractInvoice
      tags: [invoices]
      summary: Run (or re-run) extraction on an invoice
      description: Triggers the extraction service for the invoice. Uses OpenAI when configured, otherwise a development mock. Returns the invoice with extractionStatus set to PROCESSING.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice after extraction was triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /invoices/{id}/status:
    patch:
      operationId: updateInvoiceStatus
      tags: [invoices]
      summary: Transition invoice status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceStatusUpdate"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /invoices/{id}/voucher:
    patch:
      operationId: setVoucherId
      tags: [invoices]
      summary: Set VoucherID after ERP posting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoucherInput"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /invoices/{id}/approve:
    post:
      operationId: approveInvoice
      tags: [invoices]
      summary: Approve an invoice (AP Approver action)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveInput"
      responses:
        "200":
          description: Approved invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /invoices/{id}/reject:
    post:
      operationId: rejectInvoice
      tags: [invoices]
      summary: Reject invoice back to extraction (AP Reviewer action)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: Rejected invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /invoices/{id}/submit:
    post:
      operationId: submitInvoice
      tags: [invoices]
      summary: Submit invoice for approval (validates confidence + duplicate)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice submitted or routed to exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Duplicate invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /invoices/bulk-approve:
    post:
      operationId: bulkApproveInvoices
      tags: [invoices]
      summary: Approve multiple invoices at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActionInput"
      responses:
        "200":
          description: Bulk approve result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  # ─── Vendors ─────────────────────────────────────────────────────────────────
  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List vendors with search, filters, sort, and pagination
      parameters:
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: isActive
          in: query
          schema:
            type: ["boolean", "null"]
        - name: onHold
          in: query
          schema:
            type: ["boolean", "null"]
        - name: requiresPO
          in: query
          schema:
            type: ["boolean", "null"]
        - name: missingApEmail
          in: query
          schema:
            type: ["boolean", "null"]
        - name: missingPaymentTerms
          in: query
          schema:
            type: ["boolean", "null"]
        - name: vendorCategory
          in: query
          schema:
            type: ["string", "null"]
        - name: vendorType
          in: query
          schema:
            type: ["string", "null"]
        - name: updatedSince
          in: query
          schema:
            type: ["string", "null"]
            format: date-time
        - name: sortBy
          in: query
          schema:
            type: ["string", "null"]
            enum: [vendorName, vendorCode, updatedAt, createdAt]
        - name: sortDir
          in: query
          schema:
            type: ["string", "null"]
            enum: [asc, desc]
      responses:
        "200":
          description: Vendor list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorListResponse"
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Create a new vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInput"
      responses:
        "201":
          description: Vendor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "409":
          description: Duplicate vendor code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /vendors/import:
    post:
      operationId: importVendors
      tags: [vendors]
      summary: Bulk-import vendors from JSON array
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorImportResult"

  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get vendor by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateVendor
      tags: [vendors]
      summary: Update a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorUpdate"
      responses:
        "200":
          description: Updated vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /vendors/profile-export:
    get:
      operationId: exportVendorProfiles
      tags: [vendors]
      summary: Export vendor profiles as a CSV download
      parameters:
        - name: isActive
          in: query
          schema:
            type: ["boolean", "null"]
        - name: onHold
          in: query
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string

  /vendors/{id}/activity:
    get:
      operationId: getVendorActivity
      tags: [vendors]
      summary: Invoice activity summary for a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activity summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorActivityResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /vendors/{id}/audit:
    get:
      operationId: getVendorAuditLog
      tags: [vendors]
      summary: Audit log for a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorAuditEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ─── Duplicate Check ─────────────────────────────────────────────────────────
  /invoices/{id}/check-duplicate:
    post:
      operationId: checkDuplicate
      tags: [invoices]
      summary: Check whether an invoice is a likely duplicate of an existing APPROVED/POSTED invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Duplicate check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateCheckResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ─── Audit Log ───────────────────────────────────────────────────────────────
  /invoices/{id}/audit:
    get:
      operationId: getInvoiceAuditLog
      tags: [audit]
      summary: Get audit log entries for an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"

  # ─── Source Documents ────────────────────────────────────────────────────────
  /source-documents:
    get:
      tags: [sourceDocuments]
      operationId: listSourceDocuments
      summary: List uploaded source documents with linked-invoice counts
      parameters:
        - name: processingStatus
          in: query
          schema:
            type: string
            enum: [PENDING, DETECTING, COMPLETED, EXCEPTION]
        - name: includeRemoved
          in: query
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          schema:
            type: string
          description: Match by original file name
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Source document list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDocumentListResponse"
    post:
      tags: [sourceDocuments]
      operationId: createSourceDocument
      summary: Create a source document from an uploaded file and start detection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceDocumentInput"
      responses:
        "201":
          description: Source document created; detection started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDocumentWithInvoices"
        "400":
          description: Missing or invalid required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /source-documents/{id}:
    get:
      tags: [sourceDocuments]
      operationId: getSourceDocument
      summary: Get a source document with its detected invoices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Source document with invoices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDocumentWithInvoices"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [sourceDocuments]
      operationId: deleteSourceDocument
      summary: Permanently hard-delete a source document and all its invoices (test-data cleanup)
      description: >-
        Permanently removes a source document together with every child invoice
        and their audit/extraction records, and deletes the stored file. Blocked
        when any child invoice is posted. Requires explicit confirmation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HardDeleteInput"
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Source document cannot be hard-deleted (e.g. posted child) or confirmation missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /source-documents/{id}/remove:
    post:
      tags: [sourceDocuments]
      operationId: removeSourceDocument
      summary: Remove a source document and void all its invoices (soft removal with reason)
      description: >-
        Marks a source document and all of its child invoices as removed/voided
        with a required reason. Removed records are excluded from active lists,
        queues, KPIs, CSV export and duplicate detection by default.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemovalInput"
      responses:
        "200":
          description: Source document after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDocumentWithInvoices"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Missing removal reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ─── Storage ─────────────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ─── Phase 2: Dashboard & Analytics ──────────────────────────────────────────
  /dashboard/metrics:
    get:
      tags: [dashboard]
      operationId: getDashboardMetrics
      summary: Aggregated dashboard metrics for AP invoice capture (Phase 2)
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: vendorId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_EXTRACTION, EXCEPTION, PENDING_APPROVAL, APPROVED, POSTED, VOIDED]
        - name: exportStatus
          in: query
          schema:
            type: string
            enum: [NOT_READY, READY, EXPORTED, FAILED, BLOCKED]
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetrics"

  /analytics/vendors:
    get:
      tags: [analytics]
      operationId: getVendorAnalytics
      summary: Per-vendor invoice analytics
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Vendor analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorAnalyticsResponse"

  # ─── Phase 2: Exception Management ───────────────────────────────────────────
  /exceptions:
    get:
      tags: [exceptions]
      operationId: listExceptions
      summary: List invoices in exception with management filters
      parameters:
        - name: reason
          in: query
          schema:
            type: string
          description: Filter by exception reason substring
        - name: owner
          in: query
          schema:
            type: string
        - name: reviewed
          in: query
          schema:
            type: ["boolean", "null"]
        - name: assignedTo
          in: query
          description: Filter by actor name assigned as exception owner; unassigned items always included
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [age, vendorName, totalAmount, confidenceScore, status]
            default: age
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Exception list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceListResponse"

  /invoices/{id}/exception/events:
    get:
      tags: [exceptions]
      operationId: getExceptionEvents
      summary: Exception activity history for an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Exception events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExceptionEvent"

  /invoices/{id}/exception/note:
    post:
      tags: [exceptions]
      operationId: addExceptionNote
      summary: Add an internal note to an exception
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExceptionNoteInput"
      responses:
        "201":
          description: Note recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionEvent"

  /invoices/{id}/exception/assign:
    post:
      tags: [exceptions]
      operationId: assignException
      summary: Assign an owner to an exception
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExceptionAssignInput"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}/exception/review:
    post:
      tags: [exceptions]
      operationId: reviewException
      summary: Mark an exception as reviewed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExceptionReviewInput"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}/exception/return-to-approval:
    post:
      tags: [exceptions]
      operationId: returnExceptionToApproval
      summary: Return a resolved exception to the approval queue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExceptionReturnInput"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "422":
          description: Invoice is not in a returnable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /source-documents/{id}/audit:
    get:
      tags: [sourceDocuments]
      operationId: getSourceDocumentAudit
      summary: Aggregated audit trail across a source document's invoices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"

  # ─── Phase 2: Imports (file-based reference data) ─────────────────────────────
  /imports:
    get:
      tags: [imports]
      operationId: listImports
      summary: List import batch history
      parameters:
        - name: importType
          in: query
          schema:
            type: string
            enum: [VENDOR_MASTER, INVOICE_CORRECTION]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Import batches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatchListResponse"
    post:
      tags: [imports]
      operationId: commitImport
      summary: Commit a validated import (applies rows to the database)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportCommitInput"
      responses:
        "201":
          description: Import committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "422":
          description: Import has blocking validation errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /imports/validate:
    post:
      tags: [imports]
      operationId: validateImport
      summary: Validate an import file and preview rows without committing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportValidationInput"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportValidationResult"

  /imports/template:
    get:
      tags: [imports]
      operationId: getImportTemplate
      summary: Download a CSV template for an import type
      parameters:
        - name: importType
          in: query
          required: true
          schema:
            type: string
            enum: [VENDOR_MASTER, INVOICE_CORRECTION]
      responses:
        "200":
          description: CSV template
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /imports/{id}:
    get:
      tags: [imports]
      operationId: getImport
      summary: Get an import batch by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Import batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ─── Phase 2: Exports (file-based; NOT ERP integration) ──────────────────────
  /exports:
    get:
      tags: [exports]
      operationId: listExports
      summary: List export batch history
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Export batches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportBatchListResponse"
    post:
      tags: [exports]
      operationId: createExport
      summary: Generate an export file package and record the batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "201":
          description: Export batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportBatch"

  /exports/{id}:
    get:
      tags: [exports]
      operationId: getExport
      summary: Get an export batch by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Export batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportBatch"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /exports/{id}/download:
    get:
      tags: [exports]
      operationId: downloadExport
      summary: Download the CSV file for an export batch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary

  # ─── Phase 2: Accuracy reporting framework ───────────────────────────────────
  /accuracy-runs:
    get:
      tags: [accuracy]
      operationId: listAccuracyRuns
      summary: List recorded extraction-accuracy runs
      responses:
        "200":
          description: Accuracy runs (measured=false when no labeled pack has been run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccuracyRunListResponse"
    post:
      tags: [accuracy]
      operationId: createAccuracyRun
      summary: Record the result of a labeled accuracy run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccuracyRunInput"
      responses:
        "201":
          description: Accuracy run recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccuracyRun"

  # ─── Phase 2: User / role management ────────────────────────────────────────
  /settings/users:
    get:
      tags: [settings]
      operationId: listUsers
      summary: List all users with their roles
      responses:
        "200":
          description: Array of users with their current AP role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUserList"

  /settings/users/{userId}/role:
    patch:
      tags: [settings]
      operationId: patchUserRole
      summary: Update a user's AP role (AP_MANAGER only)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdate"
      responses:
        "200":
          description: Updated user with new role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"

  # ─── Phase 2: Admin settings ─────────────────────────────────────────────────
  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Get internal configuration (safe defaults applied)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      tags: [settings]
      operationId: updateSettings
      summary: Update internal configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── Invoice ────────────────────────────────────────────────────────────────
    Invoice:
      type: object
      required:
        - id
        - status
        - createdAt
        - updatedAt
        - fileObjectPath
        - originalFileName
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [PENDING_EXTRACTION, EXCEPTION, PENDING_APPROVAL, APPROVED, POSTED, VOIDED]
        vendorId:
          type: ["integer", "null"]
        vendorName:
          type: ["string", "null"]
        invoiceNumber:
          type: ["string", "null"]
        invoiceDate:
          type: ["string", "null"]
        totalAmount:
          type: ["number", "null"]
        taxAmount:
          type: ["number", "null"]
        poNumber:
          type: ["string", "null"]
        currency:
          type: string
          default: USD
        fileObjectPath:
          type: string
        originalFileName:
          type: string
        documentId:
          type: ["string", "null"]
        businessDocumentId:
          type: ["string", "null"]
          description: Business-facing display ID formatted as "VendorID - InvoiceNumber - Amount" (e.g. "V-00123 - INV-12345 - 1309.00"). Null until vendor is matched and invoice number/total are available.
        vendorRawName:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        voucherId:
          type: ["string", "null"]
        exceptionReason:
          type: ["string", "null"]
        lowConfidenceFields:
          type: ["string", "null"]
        confidenceScore:
          type: ["number", "null"]
        subtotal:
          type: ["number", "null"]
        freightAmount:
          type: ["number", "null"]
        discountAmount:
          type: ["number", "null"]
          description: Discount/credit reduction extracted from the invoice (stored as a positive magnitude; subtracted in the tie-out formula).
        otherChargesAmount:
          type: ["number", "null"]
          description: Other charges, fees, or surcharges extracted from the invoice (added in the tie-out formula; negative values represent credits).
        tieOutExpectedTotal:
          type: ["number", "null"]
          description: Computed expected total = subtotal + tax + freight + other charges − discount.
        tieOutDifference:
          type: ["number", "null"]
          description: Extracted invoice total minus the expected total.
        tieOutStatus:
          type: ["string", "null"]
          description: Header tie-out outcome — one of PASS, WARNING, FAIL, SKIPPED.
        tieOutExplanation:
          type: ["string", "null"]
          description: Human-readable explanation of how the tie-out was computed and why it passed, warned, failed, or was skipped.
        paymentTerms:
          type: ["string", "null"]
        vendorMatchScore:
          type: ["number", "null"]
        validationStatus:
          type: ["string", "null"]
          description: Outcome of the authoritative validation engine (e.g. PASS, NEEDS_REVIEW, FAIL).
        reviewStatus:
          type: ["string", "null"]
          description: Review flag set when an invoice needs human review (e.g. NEEDS_REVIEW).
        overallReviewStatus:
          type: ["string", "null"]
          description: Aggregate human review state (e.g. PENDING, APPROVED).
        duplicateCheck:
          type: ["string", "null"]
          description: Result of the duplicate (vendor + invoice number) check.
        vendorCheck:
          type: ["string", "null"]
          description: Result of the vendor validation check (required/active/not on hold/matched).
        poCheck:
          type: ["string", "null"]
          description: Result of the purchase order capture check.
        amountCheck:
          type: ["string", "null"]
          description: Result of the amount validation check (total > 0, currency).
        totalTieOut:
          type: ["string", "null"]
          description: Result of the header tie-out check (subtotal + tax + freight = total).
        validationDetails:
          type: ["string", "null"]
          description: JSON detail of all validation checks, blocking issues, and warnings.
        extractionStatus:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED]
          default: PENDING
        extractionError:
          type: ["string", "null"]
        extractionAttempts:
          type: integer
          default: 0
        extractionErrorDetail:
          type: ["string", "null"]
          description: Safe JSON troubleshooting detail for a failed extraction (no sensitive data).
        fieldConfidence:
          type: ["string", "null"]
          description: JSON map of per-field confidence (0-100) keyed by field name.
        extractionNotes:
          type: ["string", "null"]
        lastExtractedAt:
          type: ["string", "null"]
          format: date-time
        sourceDocumentId:
          type: ["integer", "null"]
          description: ID of the source document this invoice was detected/split from.
        invoiceSequence:
          type: ["integer", "null"]
          description: 1-based position of this invoice within its source document.
        pageStart:
          type: ["integer", "null"]
          description: 1-based first page of this invoice within the source document.
        pageEnd:
          type: ["integer", "null"]
          description: 1-based last page (inclusive) of this invoice within the source document.
        role:
          type: string
          enum: [AP_PROCESSOR, AP_APPROVER]
          default: AP_PROCESSOR
        removedAt:
          type: ["string", "null"]
          format: date-time
          description: Timestamp when the invoice was voided/removed. Null when active.
        removedBy:
          type: ["string", "null"]
          description: Actor who voided/removed the invoice.
        removalReason:
          type: ["string", "null"]
          description: Required reason captured when the invoice was voided/removed.
        removalNote:
          type: ["string", "null"]
          description: Optional free-text note captured at removal time.
        exportStatus:
          type: ["string", "null"]
          description: File-based export readiness — one of NOT_READY, READY, EXPORTED, FAILED, BLOCKED. This is NOT an ERP status.
        exportBatchId:
          type: ["string", "null"]
          description: Business ID of the export batch this invoice was last included in.
        exportedAt:
          type: ["string", "null"]
          format: date-time
        exportBlockedReason:
          type: ["string", "null"]
        exportRetryCount:
          type: integer
          default: 0
        exportFileName:
          type: ["string", "null"]
        exportFormat:
          type: ["string", "null"]
        exceptionOwner:
          type: ["string", "null"]
          description: AP user assigned to work this exception.
        exceptionReviewedAt:
          type: ["string", "null"]
          format: date-time
        exceptionReviewedBy:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InvoiceInput:
      type: object
      required:
        - fileObjectPath
        - originalFileName
      properties:
        fileObjectPath:
          type: string
        originalFileName:
          type: string
        vendorId:
          type: ["integer", "null"]
        invoiceNumber:
          type: ["string", "null"]
        invoiceDate:
          type: ["string", "null"]
        totalAmount:
          type: ["number", "null"]
        taxAmount:
          type: ["number", "null"]
        poNumber:
          type: ["string", "null"]
        currency:
          type: string
          default: USD
        vendorRawName:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        confidenceScore:
          type: ["number", "null"]
        lowConfidenceFields:
          type: ["string", "null"]

    InvoiceUpdate:
      type: object
      properties:
        vendorId:
          type: ["integer", "null"]
        invoiceNumber:
          type: ["string", "null"]
        invoiceDate:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        totalAmount:
          type: ["number", "null"]
        taxAmount:
          type: ["number", "null"]
        poNumber:
          type: ["string", "null"]
        currency:
          type: ["string", "null"]
        vendorRawName:
          type: ["string", "null"]
        confidenceScore:
          type: ["number", "null"]
        lowConfidenceFields:
          type: ["string", "null"]
        subtotal:
          type: ["number", "null"]
        freightAmount:
          type: ["number", "null"]
        discountAmount:
          type: ["number", "null"]
        otherChargesAmount:
          type: ["number", "null"]
        paymentTerms:
          type: ["string", "null"]
        editorRole:
          type: string
          default: AP_PROCESSOR

    InvoiceStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [PENDING_EXTRACTION, EXCEPTION, PENDING_APPROVAL, APPROVED, POSTED]
        reason:
          type: ["string", "null"]

    VoucherInput:
      type: object
      required:
        - voucherId
      properties:
        voucherId:
          type: string
          minLength: 1

    RejectInput:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1

    ApproveInput:
      type: object
      properties:
        reason:
          type: ["string", "null"]
          description: Documented reason — required when approving an invoice that is in exception (override).

    DuplicateCheckResult:
      type: object
      required:
        - isDuplicate
        - matchedIds
        - riskScore
        - matchType
      properties:
        isDuplicate:
          type: boolean
        matchedIds:
          type: array
          items:
            type: integer
        riskScore:
          type: number
          description: "0 = no match, 0.7 = fuzzy match, 1.0 = exact match"
        matchType:
          type: string
          enum: [none, exact, fuzzy]

    BulkActionInput:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: integer

    BulkActionResult:
      type: object
      required:
        - succeeded
        - failed
      properties:
        succeeded:
          type: integer
        failed:
          type: integer
        errors:
          type: array
          items:
            type: string

    InvoiceListResponse:
      type: object
      required:
        - data
        - total
        - page
        - limit
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        total:
          type: integer
        page:
          type: integer
        limit:
