          type: integer
        exception:
          type: integer
        pendingApproval:
          type: integer
        approved:
          type: integer
        posted:
          type: integer
        needsReview:
          type: integer
        totalApprovedAmount:
          type: number

    # ─── Source Document ─────────────────────────────────────────────────────────
    SourceDocument:
      type: object
      required:
        - id
        - originalFileName
        - fileObjectPath
        - sourceChannel
        - processingStatus
        - uploadedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        originalFileName:
          type: string
        fileObjectPath:
          type: string
        fileHash:
          type: ["string", "null"]
        duplicateOfSourceDocumentId:
          type: ["integer", "null"]
          description: >-
            ID of the most recent non-removed source document with the same
            content hash, when a duplicate file upload is detected. Null when
            no duplicate was found. Advisory only — does not block processing.
        sourceChannel:
          type: string
        uploadedBy:
          type: ["string", "null"]
        uploadedAt:
          type: string
          format: date-time
        pageCount:
          type: ["integer", "null"]
        detectedInvoiceCount:
          type: ["integer", "null"]
        processingStatus:
          type: string
          enum: [PENDING, DETECTING, COMPLETED, EXCEPTION]
        processingError:
          type: ["string", "null"]
        removedAt:
          type: ["string", "null"]
          format: date-time
          description: Timestamp when the source document was removed. Null when active.
        removedBy:
          type: ["string", "null"]
          description: Actor who removed the source document.
        removalReason:
          type: ["string", "null"]
          description: Required reason captured when the source document was removed.
        removalNote:
          type: ["string", "null"]
          description: Optional free-text note captured at removal time.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SourceDocumentInput:
      type: object
      required:
        - fileObjectPath
        - originalFileName
      properties:
        fileObjectPath:
          type: string
          minLength: 1
        originalFileName:
          type: string
          minLength: 1
        contentType:
          type: ["string", "null"]
        fileHash:
          type: ["string", "null"]

    SourceDocumentWithInvoices:
      type: object
      required:
        - source
        - invoices
        - invoiceCount
        - extractedCount
        - exceptionCount
        - pendingCount
        - removedCount
      properties:
        source:
          $ref: "#/components/schemas/SourceDocument"
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        invoiceCount:
          type: integer
          description: Count of active (non-removed) invoices.
        extractedCount:
          type: integer
        exceptionCount:
          type: integer
        pendingCount:
          type: integer
        removedCount:
          type: integer
          description: Count of voided/removed invoices belonging to this source document.
        duplicateSourceDocument:
          type: ["object", "null"]
          description: >-
            Summary of the matched source document when duplicateOfSourceDocumentId
            is set on the source, for UI display without an extra round-trip.
            Null when no duplicate was detected.
          properties:
            id:
              type: integer
            originalFileName:
              type: string
            uploadedAt:
              type: string
              format: date-time

    RemovalInput:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          description: Required reason for voiding/removing the record.
        note:
          type: ["string", "null"]
          description: Optional free-text note.

