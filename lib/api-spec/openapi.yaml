            type: number
        threshold:
          type: ["number", "null"]
        passed:
          type: ["boolean", "null"]
        reportRef:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    AccuracyRunInput:
      type: object
      required:
        - testPackName
        - invoicesTested
        - fieldsTested
        - correctFields
        - incorrectFields
        - missingFields
      properties:
        testPackName:
          type: string
          minLength: 1
        invoicesTested:
          type: integer
        fieldsTested:
          type: integer
        correctFields:
          type: integer
        incorrectFields:
          type: integer
        missingFields:
          type: integer
        overallAccuracy:
          type: ["number", "null"]
        accuracyByCategory:
          type: object
          additionalProperties:
            type: number
        threshold:
          type: ["number", "null"]
        passed:
          type: ["boolean", "null"]
        reportRef:
          type: ["string", "null"]

    AccuracyRunListResponse:
      type: object
      required: [data, measured]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AccuracyRun"
        measured:
          type: boolean
          description: False when no labeled accuracy run has been recorded ("Not measured").

    # ─── Phase 2: Users ──────────────────────────────────────────────────────
    AppRole:
      type: string
      enum: [AP_MANAGER, AP_CLERK]
      description: AP role assigned to a Clerk user.

    AppUser:
      type: object
      description: A single Clerk user with their current AP role
      required:
        - userId
        - email
        - role
      properties:
        userId:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/AppRole"

    AppUserList:
      type: array
      description: List of users with their AP roles
      items:
        $ref: "#/components/schemas/AppUser"

    UserRoleUpdate:
      type: object
      description: Body for patching a user's role
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/AppRole"

    # ─── Phase 2: Settings ───────────────────────────────────────────────────
    Settings:
      type: object
      required:
        - extractionConfidenceThreshold
        - vendorMatchThreshold
        - tieOutPassTolerance
        - tieOutWarningTolerance
        - defaultPageSize
        - defaultExportFormat
      properties:
        extractionConfidenceThreshold:
          type: number
          description: Percent (0-100). Safe default 85.
        vendorMatchThreshold:
          type: number
          description: Percent (0-100). Safe default 85.
        tieOutPassTolerance:
          type: number
          description: Absolute currency tolerance for a tie-out PASS. Safe default 0.01.
        tieOutWarningTolerance:
          type: number
          description: Absolute currency tolerance for a tie-out WARNING. Safe default 0.05.
        defaultPageSize:
          type: integer
          description: Default list page size. Safe default 20.
        defaultExportFormat:
          type: string
          description: Default export format. Safe default CSV.

    SettingsUpdate:
      type: object
      properties:
        extractionConfidenceThreshold:
          type: ["number", "null"]
        vendorMatchThreshold:
          type: ["number", "null"]
        tieOutPassTolerance:
          type: ["number", "null"]
        tieOutWarningTolerance:
          type: ["number", "null"]
        defaultPageSize:
          type: ["integer", "null"]
        defaultExportFormat:
          type: ["string", "null"]
        updatedBy:
          type: ["string", "null"]
